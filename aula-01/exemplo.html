<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Exemplo para dissecar</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: navy; }
    footer { background-color: #eeeeee; padding: 10px; }
  </style>
</head>
<body>
  <header>
    <h1>Clube de Atletismo da Vila</h1>
    <nav>
      <ul>
        <li><a href="#treinos">Treinos</a></li>
        <li><a href="#resultados">Resultados</a></li>
        <li><a href="#contactos">Contactos</a></li>
      </ul>
    </nav>
  </header>
  <p>Corre connosco! Treinos para jovens dos 10 aos 18 anos.</p>
  <img src="pista.svg" alt="Desenho de uma pista de atletismo">
  <h2 id="treinos">Treinos</h2>
  <p>Terça e quinta, das 18:00 às 19:30, na pista municipal.</p>
  <button id="botao">Mostrar mensagem</button>
  <p id="mensagem"></p>
  <footer id="contactos">
    <p>Clube de Atletismo da Vila · exemplo inventado para a aula</p>
  </footer>
  <script src="exemplo.js"></script>
</body>
</html>
