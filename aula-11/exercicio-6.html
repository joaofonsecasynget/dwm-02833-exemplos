<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Exercício 6 — dá um título à tabela</title>
  <style>td, th { border: 1px solid; }</style>
</head>
<body>
  <!-- Opcional. Acrescenta o título Preços da fruta, com caption, e valida em validator.w3.org. -->
  <table>
    <tr>
      <th>Produto</th>
      <th>Preço</th>
    </tr>
    <tr>
      <td>Maçã</td>
      <td>1 €</td>
    </tr>
  </table>
  <!-- Extensão: acrescenta a linha Pera | 2 €. -->
</body>
</html>
