<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Exercício 4 — acrescenta uma coluna</title>
  <style>td, th { border: 1px solid; }</style>
</head>
<body>
  <!-- Obrigatório. Acrescenta a coluna Som: um th Som no fim da primeira linha e um td no fim de cada
       uma das outras (o cão ladra, a galinha cacareja). -->
  <table>
    <tr>
      <th>Animal</th>
      <th>Patas</th>
    </tr>
    <tr>
      <td>Cão</td>
      <td>4</td>
    </tr>
    <tr>
      <td>Galinha</td>
      <td>2</td>
    </tr>
  </table>
  <!-- Extensão: acrescenta a linha Gato | 4 | mia. -->
</body>
</html>
