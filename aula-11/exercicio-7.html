<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Exercício 7 — imagens e ligações numa tabela</title>
  <style>td, th { border: 1px solid; }</style>
</head>
<body>
  <!-- Opcional. Acrescenta a linha da Lua: imagem img/lua.png e ligação para https://pt.wikipedia.org/wiki/Lua -->
  <table>
    <tr>
      <th>Astro</th>
      <th>Imagem</th>
      <th>Saber mais</th>
    </tr>
    <tr>
      <td>Sol</td>
      <td><img src="img/sol.png" alt="Um sol"></td>
      <td><a href="https://pt.wikipedia.org/wiki/Sol">Sol</a></td>
    </tr>
  </table>
  <!-- Extensão: dá um título à tabela, com caption. -->
</body>
</html>
