<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Exercício 1 — prevê o resultado</title>
</head>
<body>
  <main>
    <h2>A nossa história</h2>
    <p>O clube nasceu em 1998, com um grupo de pais e treinadores.</p>
    <h3>Hoje</h3>
    <p>Somos mais de cem atletas, de todas as idades.</p>
    <!-- Extensão -->
    <h3>Amanhã</h3>
    <p>Queremos abrir uma pista coberta para treinar no inverno.</p>
  </main>
  <!-- Resultado: "A nossa história" (h2) aparece maior do que "Hoje" (h3); cada parágrafo fica por baixo do seu título.
       Mesmo sem CSS, o browser já dá tamanhos diferentes a cada nível de título. -->
</body>
</html>
