<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Exercício 2 — completa com strong e em</title>
</head>
<body>
  <main>
    <!-- Enunciado: O treino desta semana é ____dia 14, às 18h00____ e é ____aberto a todos os níveis____.
         strong marca a informação importante (quando é); em marca a ênfase. -->
    <p>
      O treino desta semana é <strong>dia 14, às 18h00</strong> e é <em>aberto a todos os níveis</em>.
    </p>
    <!-- Extensão -->
    <p>Podes <em>trazer um amigo</em> para experimentar.</p>
  </main>
</body>
</html>
