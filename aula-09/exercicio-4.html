<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Exercício 4 — escreve de raiz</title>
</head>
<body>
  <main>
    <!-- Escreve de raiz uma lista ordenada com 3 a 5 passos para usar o serviço principal do teu cliente,
         com um h2 antes. ol, porque a ordem importa. Exemplo para uma loja: -->
    <h2>Como encomendares</h2>
    <ol>
      <li>Escolhe os produtos no catálogo</li>
      <li>Confirma a <strong>morada de entrega</strong></li> <!-- Extensão: strong dentro de um li -->
      <li>Paga e aguarda a confirmação</li>
    </ol>
  </main>
</body>
</html>
