<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Exercício 3 — altera os tipos dos campos</title>
</head>
<body>
  <!-- Obrigatório. Todos os campos estão com type="text". Altera o type de três deles:
       Email passa a email, Idade passa a number e Palavra-passe passa a password. -->
  <form>
    <p><label for="nome">Nome:</label> <input type="text" id="nome" name="nome"></p>
    <p><label for="email">Email:</label> <input type="text" id="email" name="email"></p>
    <p><label for="idade">Idade:</label> <input type="text" id="idade" name="idade"></p>
    <p><label for="palavrapasse">Palavra-passe:</label> <input type="text" id="palavrapasse" name="palavrapasse"></p>
    <button type="submit">Enviar</button>
  </form>
  <!-- Extensão: acrescenta o campo Data de nascimento com type="date". -->
</body>
</html>
