<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Exercício 6 — escolhe uma opção numa lista</title>
</head>
<body>
  <!-- Opcional. Acrescenta à lista a opção Vermelho (value="vermelho"). Depois escolhe-a, carrega em
       Enviar e confirma que o endereço acaba em ?cor=vermelho. -->
  <form>
    <p><label for="cor">Cor favorita:</label>
       <select id="cor" name="cor">
         <option value="azul">Azul</option>
         <option value="verde">Verde</option>
       </select></p>
    <button type="submit">Enviar</button>
  </form>
  <!-- Extensão: acrescenta a opção Amarelo. -->
</body>
</html>
