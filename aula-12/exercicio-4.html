<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Exercício 4 — completa a validação</title>
</head>
<body>
  <!-- Obrigatório. Substitui cada ____: o nome é obrigatório; a idade tem de estar entre 10 e 18;
       o PIN aceita no máximo 4 caracteres. -->
  <form>
    <p><label for="nome">Nome:</label> <input type="text" id="nome" name="nome" ____></p>
    <p><label for="idade">Idade (10 a 18):</label>
       <input type="number" id="idade" name="idade" ____="10" ____="18"></p>
    <p><label for="pin">PIN:</label> <input type="text" id="pin" name="pin" maxlength="____"></p>
    <button type="submit">Enviar</button>
  </form>
  <!-- Extensão: acrescenta placeholder="o teu nome" ao campo Nome. -->
</body>
</html>
