<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Exercício 2 — completa as etiquetas</title>
</head>
<body>
  <!-- Obrigatório. Substitui cada ____ para que a etiqueta fique ligada ao campo: ao clicares no texto
       "Apelido", o cursor tem de ir para o campo. -->
  <form>
    <p><label for="nome">Nome:</label> <input type="text" id="nome" name="nome"></p>
    <p><____ for="____">Apelido:</____> <input type="text" id="apelido" name="apelido"></p>
    <button type="submit">Enviar</button>
  </form>
  <!-- Extensão: acrescenta o campo Cidade, com a sua label (for e id iguais). -->
</body>
</html>
